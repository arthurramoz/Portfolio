<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4A" />
      <stop offset="50%" stop-color="#14213B" />
      <stop offset="100%" stop-color="#0B1322" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EFD8" />
      <stop offset="35%" stop-color="#E5C77A" />
      <stop offset="70%" stop-color="#C5A55A" />
      <stop offset="100%" stop-color="#93752A" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A68A3E" stop-opacity="0.4" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C5A55A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Luxury Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="12" />

  <!-- Scales of Justice Symbol -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)">
    <!-- Top Finial / Spearhead -->
    <path d="M256 80 L270 108 H242 Z" />
    <circle cx="256" cy="116" r="9" />

    <!-- Central Pillar (Balanced Justice Column) -->
    <rect x="250" y="122" width="12" height="236" rx="6" />

    <!-- Pillar Rings / Moldings -->
    <rect x="240" y="338" width="32" height="10" rx="3" />
    
    <!-- Base Pedestal (Stability & Law) -->
    <rect x="206" y="364" width="100" height="14" rx="4" />
    <rect x="180" y="378" width="152" height="20" rx="6" />

    <!-- Central Fulcrum Pivot Ring -->
    <circle cx="256" cy="154" r="14" />
    <circle cx="256" cy="154" r="6" fill="#14213B" />

    <!-- Crossbeam (Horizontal Balance Bar) -->
    <path d="M120 155 C 180 147, 332 147, 392 155 C 394 160, 390 164, 384 164 C 330 157, 182 157, 128 164 C 122 164, 118 160, 120 155 Z" />

    <!-- Left Scale Suspension Chains -->
    <path d="M130 164 L86 256 H174 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Pan (Plate) -->
    <path d="M78 256 Q 130 286 182 256 Z" />

    <!-- Right Scale Suspension Chains -->
    <path d="M382 164 L338 256 H426 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Pan (Plate) -->
    <path d="M330 256 Q 382 286 434 256 Z" />
  </g>
</svg>
